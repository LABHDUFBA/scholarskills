name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml requests

      - name: Validate the meta-skill package
        run: python scientific-agent-skill-development/scripts/validate_skill.py scientific-agent-skill-development

      - name: Validate SS-0001 (Zotero)
        run: python scientific-agent-skill-development/scripts/validate_skill.py zotero-reference-management

      - name: Validate the reference example
        run: python scientific-agent-skill-development/scripts/validate_skill.py scientific-agent-skill-development/examples/descriptive-analysis

      - name: Validate the template (placeholders expected)
        run: python scientific-agent-skill-development/scripts/validate_skill.py skill-template --allow-template --allow-placeholders

      - name: Protocol test suite
        working-directory: scientific-agent-skill-development
        run: python -m unittest discover -s tests -v

      - name: Reference example test suite
        working-directory: scientific-agent-skill-development/examples/descriptive-analysis
        run: python -m unittest discover -s tests -v

      - name: SS-0001 test suite (offline, mock HTTP)
        working-directory: zotero-reference-management
        run: python -m unittest discover -s tests -v

      - name: Validate SS-0010 (DOU and covenants)
        run: python scientific-agent-skill-development/scripts/validate_skill.py dou-federal-gazette

      - name: SS-0010 test suite (offline, recorded fixtures)
        working-directory: dou-federal-gazette
        run: python -m unittest discover -s tests -v

      - name: Validate SS-0011 (SICONFI fiscal data)
        run: python scientific-agent-skill-development/scripts/validate_skill.py brazilian-fiscal-data

      - name: SS-0011 test suite (offline, recorded payloads)
        working-directory: brazilian-fiscal-data
        run: python -m unittest discover -s tests -v

      - name: Validate SS-0012 (Hugo site maintenance)
        run: python scientific-agent-skill-development/scripts/validate_skill.py hugo-site-maintenance

      - name: SS-0012 test suite (offline, temporary site)
        working-directory: hugo-site-maintenance
        run: python -m unittest discover -s tests -v

      - name: Validate SS-0013 (Lattes CV editing)
        run: python scientific-agent-skill-development/scripts/validate_skill.py lattes-cv-editing

      - name: SS-0013 test suite (offline)
        working-directory: lattes-cv-editing
        run: python -m unittest discover -s tests -v

      - name: Deposit client test suite (offline, stubbed HTTP)
        run: python -m unittest tests.test_deposit_skills -v

      - name: Registry entries validate against the schema
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          reg = json.loads(Path("registry/registry.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("registry/metadata-schema.json").read_text(encoding="utf-8"))
          required = schema["required"]
          patterns = {"id": r"^SS-[0-9]{4}$", "slug": r"^[a-z0-9]+(-[a-z0-9]+)*$"}
          errors = []
          for entry in reg["skills"]:
              for key in required:
                  if key not in entry:
                      errors.append(f"{entry.get('id')}: missing {key}")
              for key, pat in patterns.items():
                  val = entry.get(key, "")
                  if val and not re.match(pat, val):
                      errors.append(f"{entry.get('id')}: {key} violates pattern")
              # an entry that is not available must not look like an artefact
              if entry.get("status") == "planned":
                  for k in ("doi_version", "doi_concept", "repository"):
                      if entry.get(k):
                          errors.append(f"{entry.get('id')}: planned entry has {k}")
          if errors:
              print("\n".join(errors)); sys.exit(1)
          print(f"registry ok: {len(reg['skills'])} entries")
          PY

      - name: Hub site is generated from the registry and up to date
        run: |
          python scripts/build_site.py
          python scripts/build_site.py --check

      - name: No credentials committed
        run: |
          if grep -rInE "gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY" \
              --include="*.md" --include="*.py" --include="*.json" --include="*.yml" --include="*.cff" .; then
            echo "::error::possible credential material found"; exit 1
          else
            echo "no credential patterns found"
          fi

# This workflow never publishes, tags or creates releases: publication is an operator decision
# recorded in DEPLOYMENT_LOG.md.
