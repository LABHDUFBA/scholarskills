name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml requests

      - name: Structure follows the Agent Skills specification
        run: |
          python - <<'PY'
          import re, sys, yaml
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"\A---\s*\n(.*?)\n---\s*\n", text, re.S)
          if not m:
              print("no frontmatter"); sys.exit(1)
          fm = yaml.safe_load(m.group(1))
          name = fm.get("name", "")
          assert re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name), f"bad name: {name}"
          assert len(name) <= 64
          assert name == Path.cwd().name, "name must equal directory"
          assert 0 < len(fm.get("description", "")) <= 1024
          for f in ("README.md", "CITATION.cff", "LICENSE", "CHANGELOG.md"):
              assert Path(f).exists(), f"missing {f}"
          print("frontmatter and required files ok")
          PY

      - name: Tests (offline, mock HTTP)
        run: python -m unittest discover -s tests -v

      - name: No credentials committed
        run: |
          if grep -rInE "gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ZOTERO_API_KEY=[A-Za-z0-9]{10,}" \
              --include="*.md" --include="*.py" --include="*.json" --include="*.cff" . ; then
            echo "::error::possible credential material"; exit 1
          fi
          echo "no credential patterns found"
